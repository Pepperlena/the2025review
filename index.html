    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Anton&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Nunito"', 'sans-serif'],
              display: ['"Dela Gothic One"', 'cursive'],
              mono: ['"Quicksand"', 'sans-serif'],
              serif: ['"Lora"', 'serif'],
              grand: ['"Helvetica Neue"', 'Helvetica', 'Arial', 'sans-serif'],
            },
            boxShadow: {
              'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.37)',
              'neon': '0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px rgba(255, 255, 255, 0.3)',
              'hard': '4px 4px 0px 0px rgba(0,0,0,1)',
            },
            animation: {
              'bounce-slow': 'bounce 3s infinite',
              'pop-in': 'popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'pop-up-animal': 'popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards',
              'float': 'float 6s ease-in-out infinite',
              'slide-up': 'slideUp 0.5s ease-out forwards',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'gradient-xy': 'gradient-xy 15s ease infinite',
              'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
              'crack-open': 'crackOpen 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards',
              'fade-out': 'fadeOut 0.5s forwards',
              'deal-card': 'dealCard 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards',
              'fade-up-guide': 'fadeUp 1s ease-out infinite alternate',
            },
            keyframes: {
              popIn: {
                '0%': { opacity: '0', transform: 'scale(0.5) translateY(50px)' },
                '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
              },
              dealCard: {
                '0%': { opacity: '0', transform: 'translateY(100vh) rotate(-10deg) scale(0.8)' },
                '100%': { opacity: '1', transform: 'translateY(0) rotate(var(--rotate-to)) scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              fadeUp: {
                '0%': { transform: 'translateY(5px)', opacity: '0.5' },
                '100%': { transform: 'translateY(0)', opacity: '1' }
              },
              shake: {
                '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
              },
              'gradient-xy': {
                '0%, 100%': {
                    'background-size': '400% 400%',
                    'background-position': 'left center'
                },
                '50%': {
                    'background-size': '200% 200%',
                    'background-position': 'right center'
                }
              },
              crackOpen: {
                '0%': { transform: 'translate(0, 0) rotate(0deg)' },
                '100%': { transform: 'translate(-20px, 10px) rotate(-15deg)', opacity: '0.8' }
              },
              fadeOut: {
                  '0%': { opacity: '1' },
                  '100%': { opacity: '0' }
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      .glass-panel {
        background: rgba( 255, 255, 255, 0.25 );
        box-shadow: 0 8px 32px 0 rgba( 31, 38, 135, 0.37 );
        backdrop-filter: blur( 12px );
        -webkit-backdrop-filter: blur( 12px );
        border: 1px solid rgba( 255, 255, 255, 0.18 );
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0,0,0,0.2);
        border-radius: 4px;
      }
      
      /* Confetti Particle */
      .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        background-color: #f00;
        animation: confetti-fall 3s linear forwards;
        z-index: 100;
        pointer-events: none;
      }
      @keyframes confetti-fall {
        0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
        100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
      }
    </style>
